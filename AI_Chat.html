<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Hub</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // 起動時に各サービスをタブで開く
    window.addEventListener('DOMContentLoaded', () => {
      const urls = [
        "https://chatgpt.com/",
        "https://gemini.google.com/",
        "https://m365.cloud.microsoft/chat/"
      ];
      urls.forEach(url => window.open(url, "_blank"));
    });
  </script>
</head>
<body>
  <h1>AI Hub</h1>
  <p>Launching ChatGPT, Gemini, and Copilot in tabs...</p>
</body>
</html>
